name: Web security unit tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated test dependencies
        run: >-
          python -m pip install Flask==3.1.3 Authlib==1.9.1
          joserfc==1.7.7 requests==2.34.2 psycopg2-binary python-dateutil IPy
      - name: Test auth isolation and web security without production services
        env:
          PYTHONPATH: nipap-www:nipap:pynipap
        run: |
          python -B -m unittest discover -s tests -p test_auth_options_isolation.py -v
          python -B -m unittest discover -s tests -p 'test_web_*.py' -v
