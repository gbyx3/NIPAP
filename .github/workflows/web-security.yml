name: Web security unit tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install isolated test dependencies
        run: python -m pip install Flask==3.1.3 requests==2.33.0 Authlib==1.9.1 'PyJWT[crypto]==2.15.0' psycopg2-binary python-dateutil IPy flask-xml-rpc-re==0.1.4 flask-restx==1.3.0 pyparsing parsedatetime pytz setuptools==80.9.0
      - name: Test without production services
        env:
          PYTHONPATH: nipap-www:nipap:pynipap
        run: |
          python -B -m unittest discover -s tests -p test_auth_options_isolation.py -v
          python -B -m unittest discover -s tests -p 'test_web_*.py' -v

  package-install:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install package build prerequisites
        run: sudo apt-get update && sudo apt-get install -y libpq-dev build-essential
      - name: Resolve and install the actual local packages together
        run: |
          # Existing flask-xml-rpc-re imports legacy pkg_resources at runtime.
          python -m pip install setuptools==80.9.0
          python -m pip install './nipap[jwt]' ./pynipap './nipap-www[oidc]'
          python -m pip check
          python -B -m unittest discover -s tests -p 'test_web_*.py' -v
